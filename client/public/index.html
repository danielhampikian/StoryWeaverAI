<!DOCTYPE html>
<html lang="en">
  <head>
    <!--
      THESIS: A threshold, not a form. The visitor stands outside in a grey wall of borrowed
      narrative and steps through a saturated doorway to author their own story; refuses the
      chat-app and dark-neon "AI tool" arrangement.
      OWN-WORLD: photocopy grey wall of tiny repeated phrases; ultramarine arch doorways
      (portal, reading sheet, choice buttons); sodium-orange only for crossing; Bricolage
      Grotesque display, Literata prose.
      STORY: you are not given a plot; you choose who comes, how strange, how intense, then
      decide every turn.
      FIRST VIEWPORT: left, oversized headline on the grey wall; right, a full-height arch
      standing on the bottom edge holding the setup and the orange "Cross the threshold".
      FORM: user-pinned portal/threshold concept; signature motion is the arch opening to fill
      the screen (clip-path), instant under reduced motion.
    -->
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b28d4" />
    <meta name="description" content="StoryWeaver: step through the door and write your own story with an AI co-author, one choice at a time." />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400&display=swap" />
    <title>StoryWeaver: write your own story</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run StoryWeaver.</noscript>
    <div id="root"></div>
  </body>
</html>
